x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - labcentral-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    init: true
    stop_grace_period: 35s
    read_only: true
    volumes:
      - labcentral-assets:/var/lib/labcentral/assets
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
      APP_WORKERS: ${APP_WORKERS:-2}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-256}
      ATTEMPT_RETENTION_DAYS: ${ATTEMPT_RETENTION_DAYS:-90}
      REDIS_URL: redis://redis:6379/0
      FLAG_PEPPER: ${FLAG_PEPPER:?Configura FLAG_PEPPER en .env}
      SETUP_KEY: ${SETUP_KEY:?Configura SETUP_KEY en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /var/lib/labcentral/assets/objects
      ASSET_EVENT_QUOTA_BYTES: ${ASSET_EVENT_QUOTA_BYTES:-1073741824}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-8}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks: [proxy, backend, mail-egress]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    init: true
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-http://:80}
    ports:
      - "${LABCENTRAL_BIND_ADDRESS:-0.0.0.0}:${LABCENTRAL_HTTP_PORT:-8000}:80"
      - "${LABCENTRAL_BIND_ADDRESS:-0.0.0.0}:${LABCENTRAL_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [edge, proxy]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    init: true
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      PGUSER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    volumes:
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro
      - ./backups:/backups
      - labcentral-assets:/assets:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend]

networks:
  edge:
  proxy:
    internal: true
  backend:
    internal: true
  mail-egress:

volumes:
  labcentral-db:
  labcentral-assets:
  caddy-data:
  caddy-config:
